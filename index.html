<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Submeter Calculator</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- html2canvas for canvas image export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <div class="app-container">
        
        <!-- Application Header -->
        <header class="app-header">
            <div class="logo-container">
                <svg class="app-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
                <div>
                    <h1 id="appTitle">Electric Submeter Calculator</h1>
                    <p id="appSubtitle">Calculate submeter usage & split electricity bills in real time</p>
                </div>
            </div>

            <!-- Theme Switcher -->
            <div class="theme-switcher">
                <select id="themeSelect" class="theme-select" aria-label="Select Theme">
                    <option value="system">System</option>
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>
        </header>

        <!-- Dynamic Validation Error Container -->
        <div id="subErrorMsg" class="error-banner hidden"></div>

        <!-- Split Dashboard Layout -->
        <div class="dashboard-grid">
            
            <!-- Input Panel (Left Column) -->
            <div class="card">
                <h2 id="lblFormTitle" class="card-title">⚡ Bill & Readings</h2>
                
                <div class="form-grid">
                    <div class="input-group">
                        <label id="lblNetBill" for="subNetBill">Net Bill Amount (₹)</label>
                        <input type="number" id="subNetBill" step="any" placeholder="e.g. 4500">
                    </div>

                    <div class="input-group">
                        <label id="lblMainUnits" for="subMainUnits">Main Meter Units (kWh)</label>
                        <input type="number" id="subMainUnits" step="any" placeholder="e.g. 500">
                    </div>

                    <div class="input-group">
                        <label id="lblOldReading" for="subOldReading">Submeter Old Reading</label>
                        <input type="number" id="subOldReading" step="any" placeholder="e.g. 1200">
                    </div>

                    <div class="input-group">
                        <label id="lblNewReading" for="subNewReading">Submeter New Reading</label>
                        <input type="number" id="subNewReading" step="any" placeholder="e.g. 1350">
                    </div>
                </div>

                <button id="clearDataBtn" class="btn-reset">Reset All Inputs</button>
            </div>

            <!-- Real-time Summary Side Panel (Right Column) -->
            <div class="card summary-container" id="printableArea">
                <h2 id="lblSummaryTitle" class="card-title">📊 Summary</h2>
                
                <div class="summary-stats-wrapper">
                    <div class="stat-box">
                        <span id="lblRatePerUnit">Cost Per Unit</span>
                        <strong id="subRateResult">₹ 0.00 / kWh</strong>
                    </div>
                    <div class="stat-box">
                        <span id="lblSubmeterUnits">Submeter Consumption</span>
                        <strong id="subUnitsResult">0 kWh</strong>
                    </div>
                </div>

                <div class="hero-box">
                    <span id="lblTotalPayable">TOTAL PAYABLE</span>
                    <h2 id="subAmountResult">₹ 0.00</h2>
                    <small>Calculated in real-time</small>
                </div>

                <!-- Action Buttons (Inside Summary Column) -->
                <div class="action-bar no-print">
                    <button id="btnPrint" class="btn-action">🖨️ Print / Save PDF</button>
                    <button id="btnShare" class="btn-action">📤 Share Summary</button>
                </div>
            </div>

        </div>

        <!-- Contrast Footer -->
        <footer class="app-footer">
            Electric Submeter Calculator © 2026. Built by /\/ Designz.
        </footer>

    </div>

    <!-- Application Initialization -->
    <script type="module">
        import { initApp } from './modules/submeter/submeter.js';
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
