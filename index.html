<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submeter Calculator</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="app-container">
        <!-- App Header & Theme Toggle -->
        <header class="app-header">
            <div>
                <h1 id="appTitle">Loading...</h1>
                <p id="appSubtitle"></p>
            </div>
            <select id="themeSelect" class="theme-select"></select>
        </header>

        <!-- Dynamic Validation Error Container -->
        <div id="subErrorMsg" class="error-banner hidden"></div>

        <!-- Split Dashboard Layout -->
        <div class="dashboard-grid">
            
            <!-- Input Panel -->
            <div class="card">
                <h2 id="lblFormTitle" class="card-title">⚡ Bill & Readings</h2>
                
                <div class="form-grid">
                    <div class="input-group">
                        <label id="lblNetBill" for="subNetBill"></label>
                        <input type="number" id="subNetBill" step="any">
                    </div>

                    <div class="input-group">
                        <label id="lblMainUnits" for="subMainUnits"></label>
                        <input type="number" id="subMainUnits" step="any">
                    </div>

                    <div class="input-group">
                        <label id="lblOldReading" for="subOldReading"></label>
                        <input type="number" id="subOldReading" step="any">
                    </div>

                    <div class="input-group">
                        <label id="lblNewReading" for="subNewReading"></label>
                        <input type="number" id="subNewReading" step="any">
                    </div>
                </div>

                <button id="clearDataBtn" class="btn-reset"></button>
            </div>

            <!-- Real-time Summary Side Panel -->
            <div class="card summary-container">
                <h2 id="lblSummaryTitle" class="card-title">📊 Summary</h2>

                <div class="stat-box">
                    <span id="lblRatePerUnit"></span>
                    <strong id="subRateResult">₹ 0.00 / kWh</strong>
                </div>

                <div class="stat-box">
                    <span id="lblSubmeterUnits"></span>
                    <strong id="subUnitsResult">0 kWh</strong>
                </div>

                <div class="hero-box">
                    <span id="lblTotalPayable"></span>
                    <h2 id="subAmountResult">₹ 0.00</h2>
                    <small>Calculated in real-time</small>
                </div>
            </div>

        </div>
    </div>

    <!-- Application Initialization -->
    <script type="module">
        import { initApp } from './modules/submeter/submeter.js';
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
