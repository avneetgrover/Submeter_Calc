<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submeter Calculator</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M13 2L3 14h7v8l10-12h-7z'/></svg>">
    <link rel="stylesheet" href="css/styles.css">
    <!-- html2canvas for capturing UI as Image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <div class="app-container" id="printableArea">
        <!-- Contrast Header -->
        <header class="app-header">
            <div class="brand-info">
                <div class="logo-container">
                    <!-- Embedded SVG Logo -->
                    <svg class="app-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M13 2L3 14h7v8l10-12h-7z"/>
                    </svg>
                    <div>
                        <h1 id="appTitle">Loading...</h1>
                        <p id="appSubtitle"></p>
                    </div>
                </div>
            </div>
            <select id="themeSelect" class="theme-select"></select>
        </header>

        <!-- Dynamic Validation Error Container -->
        <div id="subErrorMsg" class="error-banner hidden"></div>

        <!-- Split Dashboard Layout -->
        <div class="dashboard-grid">
            
            <!-- Input Panel -->
            <div class="card">
                <h2 id="lblFormTitle" class="card-title">⚡ Bill & Readings</h2>
                
                <div class="form-grid">
                    <div class="input-group">
                        <label id="lblNetBill" for="subNetBill"></label>
                        <input type="number" id="subNetBill" step="any">
                    </div>

                    <div class="input-group">
                        <label id="lblMainUnits" for="subMainUnits"></label>
                        <input type="number" id="subMainUnits" step="any">
                    </div>

                    <div class="input-group">
                        <label id="lblOldReading" for="subOldReading"></label>
                        <input type="number" id="subOldReading" step="any">
                    </div>

                    <div class="input-group">
                        <label id="lblNewReading" for="subNewReading"></label>
                        <input type="number" id="subNewReading" step="any">
                    </div>
                </div>

                <button id="clearDataBtn" class="btn-reset"></button>
            </div>

            <!-- Real-time Summary Side Panel -->
            <div class="card summary-container">
                <h2 id="lblSummaryTitle" class="card-title">📊 Summary</h2>

                <div class="summary-stats-wrapper">
                    <div class="stat-box">
                        <span id="lblRatePerUnit"></span>
                        <strong id="subRateResult">₹ 0.00 / kWh</strong>
                    </div>

                    <div class="stat-box">
                        <span id="lblSubmeterUnits"></span>
                        <strong id="subUnitsResult">0 kWh</strong>
                    </div>
                </div>

                <div class="hero-box">
                    <span id="lblTotalPayable"></span>
                    <h2 id="subAmountResult">₹ 0.00</h2>
                    <small>Calculated in real-time</small>
                </div>
            </div>

        </div>

        <!-- Actions Row (Print & Desktop/Mobile Share) -->
        <div class="action-bar no-print">
            <button id="btnPrint" class="btn-action">🖨️ Print / Save PDF</button>
            <button id="btnShare" class="btn-action">📤 Share Summary</button>
        </div>

        <!-- Contrast Footer -->
        <footer class="app-footer">
            Electric Submeter Calculator © 2026. Built by /\/ Designz.
        </footer>
    </div>

    <!-- Application Initialization -->
    <script type="module">
        import { initApp } from './modules/submeter/submeter.js';
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
